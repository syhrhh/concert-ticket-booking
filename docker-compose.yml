services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: concert_booking
      POSTGRES_USER: concert_user
      POSTGRES_PASSWORD: concert_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
