services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: concert_booking
      POSTGRES_USER: concert_user
      POSTGRES_PASSWORD: concert_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concert_user -d concert_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build: ./notification-service
    ports:
      - "5003:5003"
    environment:
      # Inside the compose network the database host is the service name "postgres"
      DATABASE_URL: postgresql://concert_user:concert_pass@postgres:5432/concert_booking
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # DEMO ONLY: off (normal) | error (answers 503) | slow (saves, then replies late)
      # Browser origins allowed to call this API (the react frontend)
      FAULT_MODE: ${NOTIFICATION_FAULT_MODE:-off}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  availability-service:
    build: ./availability-service
    ports:
      - "5002:5002"
    environment:
      # Inside the compose network the database host is the service name "postgres"
      DATABASE_URL: postgresql+psycopg://concert_user:concert_pass@postgres:5432/concert_booking
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build: ./booking-service
    ports:
      - "5001:5001"
    environment:
      # Inside the compose network, services are reached by their service name.
      DATABASE_URL: postgresql://concert_user:concert_pass@postgres:5432/concert_booking
      AVAILABILITY_URL: http://availability-service:5002
      NOTIFICATION_URL: http://notification-service:5003
      # Browser origins allowed to call this API (the React frontend)
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
